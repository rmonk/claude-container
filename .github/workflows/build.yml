# Builds the claude, gate and proxy images on every push to main and pushes them to GHCR as
# ghcr.io/<owner>/claude-code, ghcr.io/<owner>/claude-gate and ghcr.io/<owner>/claude-proxy,
# tagged latest and sha-<commit>. The gate and proxy builds run their tests and fail on errors.
# Each image is built natively for linux/amd64 and linux/arm64 on matching runners and pushed
# by digest; the merge job then publishes one multi-arch manifest under the tags.
# Actions are pinned to commit SHAs (the version is in the comment).
# Tool versions in the claude image come from the ARG defaults in claude/Dockerfile; a manual run
# can set `latest` to build some (or `all`) of them at their newest release instead.
# A weekly scheduled run rebuilds without the layer cache, so Debian security updates and the
# raised Go modules in the gotools stage are picked up even when nothing was pushed.

name: build

on:
  push:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:
    inputs:
      latest:
        description: "Build these claude-image tools at their latest release instead of the pins: 'all' or names separated by spaces (ttyd node go gh leaktk trzsz safe-chain actionlint zizmor hadolint yq)"
        required: false
        default: ""

permissions:
  contents: read  # default for any job without its own block; jobs widen it as needed

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read  # check out the build contexts
      packages: write  # push per-arch images to GHCR by digest
    strategy:
      fail-fast: false
      matrix:
        image: [claude-code, claude-gate, claude-proxy]
        arch: [amd64, arm64]
        include:
          - image: claude-code
            context: claude
          - image: claude-gate
            context: gate
          - image: claude-proxy
            context: proxy
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}

      # Each arch resolves "latest" on its own; a release landing between the two would only
      # mean the arches get different versions until the next build.
      - id: versions
        if: matrix.image == 'claude-code' && inputs.latest != ''
        env:
          LATEST: ${{ inputs.latest }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2086 # tool names are deliberately word-split
          args=$(claude/versions resolve $LATEST)
          echo "$args"
          { echo 'build-args<<EOF'; echo "$args"; echo EOF; } >> "$GITHUB_OUTPUT"

      # Pushed untagged, by digest; the merge job tags the combined manifest.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: linux/${{ matrix.arch }}
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          build-args: ${{ steps.versions.outputs.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Record digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      packages: write  # publish the tagged multi-arch manifest to GHCR
    strategy:
      fail-fast: false
      matrix:
        image: [claude-code, claude-gate, claude-proxy]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Publish multi-arch manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
        # Tags and digests are deliberately word-split into separate arguments.
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
