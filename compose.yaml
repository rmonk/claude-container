# Claude Code container, run with `podman compose up -d` on container_server.
#
#   claude  Claude Code + a browser terminal (ttyd + tmux), built from claude/Dockerfile.
#           ttyd listens only on a UNIX socket shared with the gate, never on a port.
#   gate    Passkey login in front of ttyd, built from gate/Dockerfile; what tsbridge
#           publishes. Registering the first passkey needs GATE_SETUP_CODE in gate.env.
#           Also serves ~/work read-only at /files/, for reviewing and downloading, and
#           read-write over WebDAV at /dav/ (for rclone; token auth, see README).
#
# Env files: .env (the Compose project env) is for Compose and the proxy;
# claude.env is loaded only into the claude container.
#   proxy   mitmproxy forward proxy for all of claude's outbound HTTP(S). By default it
#           passes traffic through without decrypting it. egress/egress.toml (from
#           egress/egress.example.toml) allows, blocks or injects headers per host, and
#           is reloaded when it changes.
#
# Egress is enforced: the "claude" network is internal, so the claude container's
# only way out is the proxy (programs that ignore HTTPS_PROXY can't connect).

name: claude

services:
  claude:
    # Built from claude/Dockerfile by GitHub Actions on every push to main (see README).
    # `podman compose pull` fetches a newer build; `up -d` alone keeps the one it has.
    image: ghcr.io/rmonk/claude-code:latest
    container_name: claude
    hostname: claude
    restart: unless-stopped
    depends_on:
      proxy:
        condition: service_started
      # Restart when the signer is recreated (e.g. a new key in signer.env), since signing
      # is set up from the agent's key when this container starts.
      signer:
        condition: service_started
        restart: true
    networks: [claude]
    # Same SELinux category as the signer (and its socket volume), so this container can
    # use the agent socket; other containers still can't. Being fixed, it also keeps the
    # files this container writes to its home volume readable when it's recreated.
    # Ignored without SELinux.
    security_opt: ["label=level:s0:c742,c743"]
    env_file:
      - claude.env
    # init-user starts as root only to create CLAUDE_USER (uid 1000), fill its home on
    # first use and set the git identity; then it drops to that user, with no way back,
    # and runs the rest. That starts ttyd on the gate's socket; ttyd trusts the
    # X-Auth-User header the gate sets after a passkey login. The arguments after the
    # script are ttyd's browser-side look (font, colors), changeable without a rebuild.
    # Only background/foreground are set; ANSI colors use xterm.js defaults.
    user: "0:0"
    entrypoint:
      - /usr/local/bin/init-user
      - sh
      - -c
      - |
        # System CAs + mitmproxy's CA (written by the proxy on first start), so tools
        # trust hosts the proxy decrypts. The env vars below point at this file.
        for i in $$(seq 30); do [ -s /etc/mitmproxy/mitmproxy-ca-cert.pem ] && break; sleep 1; done
        cat /etc/ssl/certs/ca-certificates.crt /etc/mitmproxy/mitmproxy-ca-cert.pem > /tmp/ca-bundle.pem 2>/dev/null \
          || cp /etc/ssl/certs/ca-certificates.crt /tmp/ca-bundle.pem
        # Commit/tag signing through the signer's ssh-agent (the key stays in that
        # container). Enabled only when the agent holds a key; otherwise git is unchanged.
        pub=""; for i in $$(seq 10); do pub=$$(ssh-add -L 2>/dev/null | grep -m1 '^ssh-') && break; sleep 1; done
        if [ -n "$$pub" ]; then
          echo "* $$pub" > /tmp/allowed_signers
          export GIT_CONFIG_COUNT=5 \
            GIT_CONFIG_KEY_0=gpg.format GIT_CONFIG_VALUE_0=ssh \
            GIT_CONFIG_KEY_1=user.signingkey GIT_CONFIG_VALUE_1="key::$$pub" \
            GIT_CONFIG_KEY_2=commit.gpgsign GIT_CONFIG_VALUE_2=true \
            GIT_CONFIG_KEY_3=tag.gpgsign GIT_CONFIG_VALUE_3=true \
            GIT_CONFIG_KEY_4=gpg.ssh.allowedSignersFile GIT_CONFIG_VALUE_4=/tmp/allowed_signers
        fi
        rm -f /tty/ttyd.sock
        exec ttyd --writable --interface /tty/ttyd.sock --auth-header X-Auth-User "$$@"
      - ttyd
      - -t
      - titleFixed=claude
      - -t
      - fontSize=15
      - -t
      - fontFamily=JetBrains Mono, Cascadia Code, Fira Code, SF Mono, Menlo, Consolas, DejaVu Sans Mono, monospace
      - -t
      - disableLeaveAlert=true
      # trzsz: `tsz <file>` in the terminal downloads it through the browser, `trz` uploads.
      - -t
      - enableTrzsz=true
      - -t
      - 'theme={"background":"#000000","foreground":"#ffffff","cursor":"#ffffff","cursorAccent":"#000000","selectionBackground":"#555555"}'
      - /usr/local/bin/session
    environment:
      # The login name, also the home directory (/home/<name>) the claude-home volume is
      # mounted at. Set in .env, since the volume path below uses it too.
      CLAUDE_USER: ${CLAUDE_USER:-claude}
      # Without a UTF-8 locale tmux replaces every non-ASCII character with "_".
      LANG: C.UTF-8
      # gh refuses to run without a token; this placeholder is what it sends, and the
      # proxy swaps in the real GITHUB_TOKEN (which stays out of this container).
      GH_TOKEN: placeholder-replaced-by-proxy
      HTTPS_PROXY: http://proxy:8080
      HTTP_PROXY: http://proxy:8080
      NO_PROXY: localhost,127.0.0.1
      https_proxy: http://proxy:8080
      http_proxy: http://proxy:8080
      no_proxy: localhost,127.0.0.1
      # Trust mitmproxy for hosts the proxy decrypts (INJECT): Claude Code and Node use
      # NODE_EXTRA_CA_CERTS; OpenSSL/Go/curl/git/Python/pip/uv use the combined bundle
      # the entrypoint writes to /tmp/ca-bundle.pem. (No PIP_CERT: safe-chain sets its own.)
      NODE_EXTRA_CA_CERTS: /etc/mitmproxy/mitmproxy-ca-cert.pem
      # The signer's agent, for git commit signing.
      SSH_AUTH_SOCK: /agent/sock
      SSL_CERT_FILE: /tmp/ca-bundle.pem
      CURL_CA_BUNDLE: /tmp/ca-bundle.pem
      GIT_SSL_CAINFO: /tmp/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /tmp/ca-bundle.pem
    volumes:
      # Claude Code itself (~/.local), its login and settings (~/.claude*),
      # shell history and ~/work (projects).
      - claude-home:/home/${CLAUDE_USER:-claude}
      # The signer's ssh-agent socket (not the key).
      - signer-sock:/agent
      # ttyd's socket, which only the gate connects to.
      - tty-sock:/tty
      # mitmproxy's CA certificate only (the proxy keeps the private key).
      - mitmproxy-ca-cert:/etc/mitmproxy:ro
    configs:
      - source: tmux_conf
        target: /etc/tmux.conf

  # Passkey (WebAuthn) login in front of ttyd. After a login it proxies the terminal,
  # websocket included, to ttyd's socket. Passkeys and the session key are in gate-data.
  gate:
    image: ghcr.io/rmonk/claude-gate:latest
    restart: unless-stopped
    # Needs no internet; tsbridge reaches it on the "claude" network.
    networks: [claude]
    # Same SELinux category as the claude container, to use ttyd's socket.
    security_opt: ["label=level:s0:c742,c743"]
    env_file:
      - gate.env
    environment:
      # The URL you open the terminal at. Passkeys are bound to its hostname: changing
      # it means registering them again.
      GATE_ORIGIN: ${GATE_ORIGIN:?set GATE_ORIGIN in .env}
      GATE_FILES: /claude-home/work
    volumes:
      - tty-sock:/tty
      - gate-data:/data
      # The claude user's home, writable for /dav/; the gate serves only its work/
      # (GATE_FILES), at /files/ after a passkey login and at /dav/ with a token. A volume
      # subpath would keep the rest of the home (Claude's login in .claude) out of this
      # container entirely, but podman ignores it and mounts the whole volume, so the
      # confinement is the gate's: it opens GATE_FILES as an os.Root, which refuses ".."
      # and symlinks that lead outside it. It writes as uid 1000, the claude user.
      - claude-home:/claude-home
    # Published on the tailnet by tsbridge (which joins the "claude" network).
    labels:
      - "tsbridge.enabled=true"
      - "tsbridge.service.name=claude"
      - "tsbridge.service.port=8080"
      - "tsbridge.service.backend_addr=http://gate:8080"

  # Holds Claude's commit-signing key in ssh-agent and shares only the agent socket, so
  # the claude container can sign but never read or copy the key. No network at all.
  # Reuses the claude image (it has ssh-agent), running as uid 1000 like the claude
  # user, since ssh-agent requires its clients to have the same uid.
  signer:
    image: ghcr.io/rmonk/claude-code:latest
    restart: unless-stopped
    network_mode: none
    security_opt: ["label=level:s0:c742,c743"]
    user: "1000:1000"
    env_file:
      - signer.env
    entrypoint:
      - sh
      - -c
      - |
        key="$$SIGNING_KEY_B64"; unset SIGNING_KEY_B64
        rm -f /agent/sock
        if [ -z "$$key" ]; then
          echo "signer: SIGNING_KEY_B64 is empty in signer.env; commit signing is off"
          exec sleep infinity
        fi
        umask 077
        ssh-agent -D -a /agent/sock >/dev/null & agent=$$!
        for i in $$(seq 20); do [ -S /agent/sock ] && break; sleep 0.5; done
        if ! printf '%s' "$$key" | base64 -d | SSH_AUTH_SOCK=/agent/sock ssh-add -q - ; then
          echo "signer: could not load the key from SIGNING_KEY_B64"; kill $$agent; exit 1
        fi
        unset key
        echo "signer: holding $$(SSH_AUTH_SOCK=/agent/sock ssh-add -l)"
        wait $$agent
    volumes:
      - signer-sock:/agent

  proxy:
    image: docker.io/mitmproxy/mitmproxy:12.2.3
    restart: unless-stopped
    # The only service with a route out: "claude" is internal, so this proxy is the
    # claude container's sole path to the internet.
    networks: [claude, egress]
    # The egress policy (allow, block, inject) is data in egress/egress.toml, mounted
    # read-only; the proxy reloads it within seconds of a change, no redeploy needed. The
    # code that enforces it is EGRESS_ADDON below.
    command:
      - sh
      - -c
      - |
        printf '%s\n' "$$EGRESS_ADDON" > /tmp/egress.py
        # Publish only the CA certificate (not the private key in mitmproxy-ca.pem) to the
        # volume the claude container mounts, once mitmproxy has created it.
        ( until [ -s /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem ]; do sleep 1; done
          cp /home/mitmproxy/.mitmproxy/mitmproxy-ca-cert.pem /ca-cert/mitmproxy-ca-cert.pem
          chmod 644 /ca-cert/mitmproxy-ca-cert.pem ) &
        # As the image's entrypoint does for mitmdump: drop to the mitmproxy user, whose
        # home is the CA volume the claude container trusts.
        exec env HOME=/home/mitmproxy gosu mitmproxy \
          mitmdump --listen-port 8080 --scripts /tmp/egress.py --set flow_detail=0
    # The ${VAR}s in egress.toml are read from .env, which only this container loads, so
    # secrets never reach the claude container.
    env_file: .env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      # Otherwise the connection log (every host claude reaches) sits in a buffer.
      PYTHONUNBUFFERED: "1"
      EGRESS_ADDON: |
        """Applies the egress policy in /etc/egress/egress.toml and reloads it when it changes.

        The policy itself (allow, block, inject) is data in that file; this is only the code that
        enforces it. See egress/egress.example.toml.
        """
        import asyncio
        import base64
        import logging
        import os
        import re
        import tomllib

        from mitmproxy import ctx, http

        PATH = os.environ.get("EGRESS_CONFIG", "/etc/egress/egress.toml")
        POLL_SECONDS = 2
        VAR = re.compile(r"\$$\{([A-Za-z_][A-Za-z0-9_]*)\}")


        class Policy:
            def __init__(self, allow=(), block=(), inject=None, deny_all=False):
                self.allow = list(allow)
                self.block = list(block)
                self.inject = inject or {}
                self.deny_all = deny_all


        def _hosts(data, section):
            table = data.get(section, {})
            if not isinstance(table, dict) or set(table) - {"hosts"}:
                raise ValueError(f"[{section}] takes only `hosts = [...]`")
            hosts = table.get("hosts", [])
            if not isinstance(hosts, list) or not all(isinstance(h, str) and h.strip() for h in hosts):
                raise ValueError(f"[{section}] hosts must be a list of host names")
            for h in hosts:
                if "/" in h or ":" in h:
                    raise ValueError(f"[{section}] {h!r}: give a host name, without scheme, port or path")
            return [h.strip().lower().rstrip(".") for h in hosts]


        def _render(value, missing):
            """Fills $${VAR} from the environment, noting variables that are unset or empty."""
            def sub(m):
                v = os.environ.get(m.group(1), "")
                if not v:
                    missing.add(m.group(1))
                return v
            return VAR.sub(sub, value)


        def _inject(data):
            table = data.get("inject", {})
            if not isinstance(table, dict):
                raise ValueError("[inject] must be tables of headers, e.g. [inject.\"api.example.com\"]")
            out = {}
            for host, headers in table.items():
                if not isinstance(headers, dict) or not headers:
                    raise ValueError(f"[inject.{host!r}] must set at least one header")
                missing, rendered = set(), {}
                for name, value in headers.items():
                    if isinstance(value, dict) and set(value) == {"basic"} and isinstance(value["basic"], str):
                        creds = _render(value["basic"], missing)
                        rendered[name] = "Basic " + base64.b64encode(creds.encode()).decode()
                    elif isinstance(value, str):
                        rendered[name] = _render(value, missing)
                    else:
                        raise ValueError(f"[inject.{host!r}] {name}: use a string or {{ basic = \"user:password\" }}")
                if missing:
                    logging.info(f"egress policy: not injecting for {host}: {', '.join(sorted(missing))} empty")
                    continue
                out[host.lower().rstrip(".")] = rendered
            return out


        def parse(text):
            data = tomllib.loads(text)
            unknown = set(data) - {"allow", "block", "inject"}
            if unknown:
                raise ValueError(f"unknown section(s): {', '.join(sorted(unknown))}")
            return Policy(_hosts(data, "allow"), _hosts(data, "block"), _inject(data))


        def _matches(host, names):
            host = host.lower().rstrip(".")
            return any(host == n or host.endswith("." + n) for n in names)


        class Egress:
            def __init__(self):
                self.policy = None
                self.signature = None
                self.task = None

            def running(self):
                self.read_policy()
                self.task = asyncio.get_running_loop().create_task(self.watch())

            async def watch(self):
                while True:
                    await asyncio.sleep(POLL_SECONDS)
                    if self._signature() != self.signature:
                        self.read_policy()

            def _signature(self):
                try:
                    st = os.stat(PATH)
                    return (st.st_ino, st.st_mtime_ns, st.st_size)
                except FileNotFoundError:
                    return None

            def read_policy(self):
                self.signature = self._signature()
                try:
                    with open(PATH, "rb") as f:
                        policy = parse(f.read().decode())
                except FileNotFoundError:
                    policy = Policy()
                    logging.warning(f"egress policy: no {PATH}; allowing everything, injecting nothing")
                except (OSError, UnicodeDecodeError, tomllib.TOMLDecodeError, ValueError) as e:
                    if self.policy is None:
                        # A warning, not an error: mitmproxy exits on errors logged during startup,
                        # and staying up (blocking) lets a fix be picked up without a restart.
                        logging.warning(f"egress policy: {PATH} is invalid, blocking everything until it's fixed: {e}")
                        policy = Policy(deny_all=True)
                    else:
                        logging.error(f"egress policy: {PATH} is invalid, keeping the previous policy: {e}")
                        return
                self.policy = policy
                # Decrypt only the hosts that get headers; everything else passes through untouched.
                if policy.inject:
                    ctx.options.update(ignore_hosts=[], allow_hosts=[rf"^{re.escape(h)}(:\d+)?$$" for h in policy.inject])
                else:
                    ctx.options.update(allow_hosts=[], ignore_hosts=[".*"])
                if not policy.deny_all:
                    logging.info(
                        f"egress policy: allowing {policy.allow or 'all hosts'}; blocking {policy.block or 'nothing'}; "
                        f"injecting for {sorted(policy.inject) or 'nothing'}"
                    )

            def refusal(self, host):
                p = self.policy
                if p is None or p.deny_all:
                    return "egress policy is invalid"
                if _matches(host, p.block):
                    return "blocked"
                if p.allow and not _matches(host, p.allow):
                    return "not in the allow list"
                return None

            def http_connect(self, flow: http.HTTPFlow):
                self._check(flow, flow.request.host)

            def request(self, flow: http.HTTPFlow):
                if self._check(flow, flow.request.pretty_host):
                    return
                # Only over HTTPS: a plain-HTTP request would carry the secret in the clear.
                if flow.request.scheme == "https":
                    flow.request.headers.update(self.policy.inject.get(flow.request.pretty_host.lower(), {}))

            def _check(self, flow, host):
                if reason := self.refusal(host):
                    logging.warning(f"BLOCK {host}:{flow.request.port} ({reason})")
                    flow.response = http.Response.make(403, f"{reason} (egress policy)\n".encode())
                    return True
                return False


        addons = [Egress()]
    volumes:
      # The egress policy. A folder rather than the file, so saves that replace the file
      # (most editors, Arcane) are seen; "z" lets the container read it under SELinux.
      - ./egress:/etc/egress:ro,z
      # mitmproxy's CA, including its private key; only this container mounts it.
      - mitmproxy-ca:/home/mitmproxy/.mitmproxy
      # Just the CA certificate, for the claude container to trust.
      - mitmproxy-ca-cert:/ca-cert

networks:
  claude:
    # Fixed name (no project prefix) so other containers (tsbridge) can join it.
    name: claude
    # No route out: members reach each other (tsbridge -> gate:8080, claude -> proxy),
    # but anything in the claude container that ignores HTTPS_PROXY can't connect out.
    internal: true
  egress:
    # Ordinary network that gives the proxy internet access.

volumes:
  claude-home:
  # In-memory, owned by uid 1000 (the agent and claude user); holds only the agent socket.
  # The SELinux context matches the signer/claude category so the socket can be created
  # and shared there (this mount option needs an SELinux host).
  signer-sock:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: 'uid=1000,gid=1000,mode=0700,context="system_u:object_r:container_file_t:s0:c742,c743"'
  # In-memory, like signer-sock; holds only ttyd's socket, shared by claude and the gate.
  tty-sock:
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: 'uid=1000,gid=1000,mode=0700,context="system_u:object_r:container_file_t:s0:c742,c743"'
  gate-data:
  mitmproxy-ca:
  mitmproxy-ca-cert:

configs:
  tmux_conf:
    content: |
      set -g default-terminal "tmux-256color"
      # ttyd's xterm.js does true color; let Claude Code use it.
      set -as terminal-features ",xterm-256color:RGB"
      set -s escape-time 10
      set -g history-limit 50000
      # Off so a plain drag selects text in the browser (ttyd copies it automatically).
      # Scroll back with Ctrl-b [ (then PgUp/arrows, q to exit).
      set -g mouse off
      # Fit the window to whichever browser tab was used last.
      set -g window-size latest
      setw -g aggressive-resize on
      set -g status-style "bg=#262626,fg=#ffffff"
      set -g status-left " #S "
      set -g status-right " %H:%M "
      setw -g window-status-current-style "fg=#ffffff,bold"
